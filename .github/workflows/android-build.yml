name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      HAS_UPLOAD_KEY: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest ships with the Android SDK (ANDROID_HOME); AGP downloads the exact platform it needs.
      - uses: gradle/actions/setup-gradle@v4

      # build.gradle.kts signs debug builds with ./debug.keystore, which is (correctly) not committed.
      - name: Create debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      # Play upload key from repository secrets (Settings > Secrets and variables > Actions).
      - name: Restore upload keystore
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks"
            echo "STORE_PASSWORD=${{ secrets.UPLOAD_STORE_PASSWORD }}"
            echo "KEY_PASSWORD=${{ secrets.UPLOAD_KEY_PASSWORD }}"
            echo "KEY_ALIAS=${{ secrets.UPLOAD_KEY_ALIAS }}"
          } >> "$GITHUB_ENV"

      - name: Build debug + release (APK and Play Store bundle)
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease bundleRelease

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload release bundle (for Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-release-aab${{ env.HAS_UPLOAD_KEY != 'true' && '-NOT-PLAY-SIGNED' || '' }}
          path: app/build/outputs/bundle/release/*.aab

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-release-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch release build on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash .github/scripts/smoke-test.sh
