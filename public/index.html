<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0F172A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Velvet">
  <link rel="manifest" href="/manifest.json">
  <title>Velvet Salon — Live Queue & Zero-Wait Booking</title>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('Velvet Service Worker registered:', reg.scope))
          .catch(err => console.log('Velvet Service Worker registration failed:', err));
      });
    }
  </script>
</head>
<body style="margin:0; background-color:#0F172A; font-family:sans-serif; color:white;">
  <div id="root"></div>
</body>
</html>
